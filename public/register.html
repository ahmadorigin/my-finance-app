<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Page</title>
  </head>
  <body>
    <header>
      <h1>My Finance App</h1>
    </header>

    <section class="card">
      <h2>Daftar</h2>
      <div class="row">
        <input
          type="text"
          id="username"
          placeholder="Masukkan Username Anda (Unik)"
        />
        <input
          type="password"
          id="password"
          placeholder="Masukkan Password (Rahasia)"
        />
        <button id="btn-register">Daftar</button>

        <p id="status" class="muted"></p>
        <p class="muted">
          Sudah punya akun? <a href="/login.html">Masuk disini...</a>
        </p>
      </div>
    </section>

    <script src="auth.js"></script>
    <script src="register.js"></script>
  </body>
</html>
