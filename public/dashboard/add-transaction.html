<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Transaction Page</title>
  </head>
  <body>
    <header>
      <h1>Youkoso...</h1>
      <a href="/logout.html">Coba Logout nich</a>
    </header>

    <hr />
    <br />

    <main>
      <section class="card">
        <h2>Add Transaction</h2>
        <div class="row">
          <select id="type">
            <option value="income">Pemasukan</option>
            <option value="expense">Pengeluaran</option>
          </select>
          <input type="number" id="amount" placeholder="Nominal" step="0.01" />
          <input id="description" placeholder="Keterangan..." />
          <input type="date" id="tx_date" />
          <button id="btn-add">Simpan</button>
          <a href="/dashboard/transaction.html">Kembali</a>
        </div>
        <p id="msg" class="error"></p>
      </section>
    </main>

    <script src="../auth.js"></script>
    <script src="add-transaction.js"></script>
  </body>
</html>
