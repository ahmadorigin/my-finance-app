<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Page</title>
  </head>
  <body>
    <header>
      <h1>Youkoso...</h1>
      <a href="/logout.html">Coba Logout nich</a>
    </header>

    <hr />
    <br />

    <main>
      <section class="card">
        <h2>Edit Your Transaction</h2>

        <div class="row">
          <select id="type">
            <option value="income">Pemasukan</option>
            <option value="expense">Pengeluaran</option>
          </select>

          <input id="amount" type="number" placeholder="Nominal" step="0.01" />
          <input id="description" placeholder="Keterangan..." />
          <input id="tx_date" type="date" />

          <button id="btn-save">Simpan</button>

          <a href="/dashboard/transaction.html">Kembali</a>
        </div>

        <p id="msg"></p>
      </section>
    </main>

    <script src="../auth.js"></script>
    <script src="edit-transaction.js"></script>
  </body>
</html>
